<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chia Tiền Nhóm · 3 hướng giao diện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9eaec;color:#1d2330;font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
.page{max-width:1500px;margin:0 auto;padding:28px 16px 60px}
.intro{max-width:62ch;margin:0 0 24px}
.intro h1{font-size:26px;margin:0 0 6px}
.intro p{margin:0;color:#4a5160}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px;align-items:start}
.opt{border-radius:14px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);box-shadow:0 1px 0 rgba(0,0,0,.06)}
.opt-head{padding:22px 22px 18px;display:flex;gap:16px;align-items:center}
.opt-head svg{flex:none;width:64px;height:64px}
.opt-name{font-size:22px;font-weight:700;margin:0;line-height:1.15}
.opt-idea{margin:4px 0 0;color:var(--muted);font-size:14px}
.swatches{display:flex;gap:6px;padding:0 22px 18px;flex-wrap:wrap}
.sw{display:grid;gap:3px;font-size:11px;color:var(--muted)}
.sw i{display:block;width:46px;height:30px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
.icons{display:flex;gap:14px;align-items:end;padding:0 22px 18px;font-size:12px;color:var(--muted)}
.icons span{display:grid;justify-items:center;gap:4px}
/* mock app */
.app{margin:0 14px 14px;background:var(--paper);border-radius:var(--r);overflow:hidden;border:var(--frame)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bar);color:var(--bar-ink)}
.bar svg{width:30px;height:30px;flex:none}
.bar b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.bar small{margin-left:auto;opacity:.8;font-size:12px}
.mock{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mock th,.mock td{padding:8px 10px;text-align:left;border-bottom:var(--rule);vertical-align:top}
.mock thead th{font-weight:600;color:var(--muted);font-size:12px;background:var(--head)}
.mock thead th strong{display:block;color:var(--ink);font-size:13px}
.mock td.n{text-align:right;white-space:nowrap}
.mock th[scope=row]{font-weight:600}
.box{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:var(--box-r);background:var(--accent);color:var(--paper);font-size:11px;vertical-align:-3px;margin-right:5px}
.box.off{background:transparent;border:1.5px solid var(--line)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:var(--tag-r);line-height:1.6;margin:1px 0}
.t-paid{background:var(--paid-bg);color:var(--paid)}
.t-extra{background:var(--extra-bg);color:var(--extra)}
.pos{color:var(--pos);font-weight:700}.neg{color:var(--neg);font-weight:700}
.settle{padding:12px 14px;display:grid;gap:4px;font-size:13px;background:var(--settle)}
.settle b{font-weight:700}
.btn{justify-self:start;margin-top:6px;font:inherit;font-weight:600;font-size:13px;padding:7px 14px;border-radius:var(--btn-r);border:var(--btn-border);background:var(--btn);color:var(--btn-ink);box-shadow:var(--btn-shadow)}
.verdict{padding:0 22px 22px;font-size:13.5px;color:var(--muted)}
.verdict p{margin:0 0 4px}

/* A — Hóa đơn */
.a{--font:"Be Vietnam Pro",sans-serif;--bg:#f6f6f3;--paper:#ffffff;--ink:#1b2430;--muted:#687080;--line:#c9cdd3;--accent:#1b2430;
  --bar:#ffffff;--bar-ink:#1b2430;--head:#ffffff;--rule:1px dashed #d4d7dc;--r:3px;--frame:1px solid #dcdfe3;--box-r:3px;--tag-r:2px;
  --paid-bg:#eef0f3;--paid:#1b2430;--extra-bg:#fdecea;--extra:#b42a22;--pos:#167a55;--neg:#c3302a;--settle:#fafaf8;
  --btn:#1b2430;--btn-ink:#fff;--btn-r:3px;--btn-border:0;--btn-shadow:none}
.a .bar{border-bottom:2px solid #1b2430}
.a .app{position:relative;padding-bottom:10px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 9px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 9px repeat-x}
.a .settle{border-top:2px solid #1b2430}

/* B — Tiền polymer */
.b{--font:"Lexend",sans-serif;--bg:#e6f3f1;--paper:#ffffff;--ink:#0d3a42;--muted:#55777b;--line:#9cc3c1;--accent:#0b8a87;
  --bar:#0b6f73;--bar-ink:#ffffff;--head:#f1f8f7;--rule:1px solid #dcebe9;--r:16px;--frame:0;--box-r:5px;--tag-r:999px;
  --paid-bg:#d8f0ec;--paid:#07605c;--extra-bg:#fbead2;--extra:#8a5310;--pos:#08807b;--neg:#b45a17;--settle:#f4faf9;
  --btn:#0b6f73;--btn-ink:#fff;--btn-r:999px;--btn-border:0;--btn-shadow:none}
.b .bar{background:
  repeating-radial-gradient(circle at 85% 50%,rgba(255,255,255,.10) 0 1px,transparent 1px 7px),
  linear-gradient(100deg,#0b6f73,#0e8a7f 60%,#c9862f)}
.b .app{box-shadow:0 8px 24px rgba(11,111,115,.12)}

/* C — Ghế nhựa */
.c{--font:"Baloo 2",sans-serif;--bg:#eef3ff;--paper:#ffffff;--ink:#16203a;--muted:#5a6483;--line:#b9c3dc;--accent:#1d5fd8;
  --bar:#1d5fd8;--bar-ink:#ffffff;--head:#f6f8ff;--rule:1.5px solid #e4e9f6;--r:18px;--frame:2px solid #16203a;--box-r:6px;--tag-r:8px;
  --paid-bg:#e1ecff;--paid:#1647a8;--extra-bg:#ffe3e1;--extra:#c12a22;--pos:#1d5fd8;--neg:#e2362f;--settle:#fff8e1;
  --btn:#ffc93c;--btn-ink:#16203a;--btn-r:12px;--btn-border:2px solid #16203a;--btn-shadow:3px 3px 0 #16203a}
.c .app{box-shadow:5px 5px 0 #16203a}
.c .mock{font-size:14px}
.c .opt-name{font-size:25px;font-weight:800}
</style>
</head>
<body>
<main class="page">
  <div class="intro">
    <h1>Chia Tiền Nhóm — chọn một hướng</h1>
    <p>Cả ba dùng cùng dữ liệu: bữa tối 2tr sếp trả và mời 500k, taxi Bình trả. Chọn một hướng, hoặc ghép (ví dụ: logo của C, màu của B).</p>
  </div>
  <div class="options" id="options"></div>
</main>

<template id="logo-a">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M12 6h17v46l-3.4-3-3.4 3-3.4-3-3.4 3L12 49z" fill="#1b2430"/>
    <path d="M35 10h17v43l-3.4 3-3.4-3-3.4 3-3.4-3-3.4 3z" fill="#fff" stroke="#1b2430" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M16 15h9M16 21h9M16 27h6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M39 19h9M39 25h9M39 31h6" stroke="#1b2430" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="44" cy="43" r="4.2" fill="#c3302a"/>
  </svg>
</template>
<template id="logo-b">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M30 4a26 26 0 0 0 0 52z" fill="#0b6f73"/>
    <path d="M34 8a26 26 0 0 1 0 52z" fill="#c9862f"/>
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
      <circle cx="29" cy="37" r="7.5"/>
      <path d="M37 19v26M32 23h9"/>
    </g>
  </svg>
</template>
<template id="logo-c">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <g stroke="#16203a" stroke-width="2.6" stroke-linejoin="round">
      <path d="M3 30h28v6l-2 4H5l-2-4z" fill="#1d5fd8"/>
      <path d="M6 40l-2 14M28 40l2 14M8 48h18" fill="none" stroke-linecap="round"/>
      <path d="M33 22h28v6l-2 4H35l-2-4z" fill="#e2362f"/>
      <path d="M36 32l-2 22M58 32l2 22M38 44h18" fill="none" stroke-linecap="round"/>
    </g>
    <ellipse cx="17" cy="33" rx="4" ry="1.6" fill="#16203a"/>
    <ellipse cx="47" cy="25" rx="4" ry="1.6" fill="#16203a"/>
  </svg>
</template>

<script>
const options = [
  { cls: "a", logo: "logo-a", name: "Hóa đơn", idea: "Tờ bill được xé đôi. Giấy trắng, mực xanh đen, dấu đỏ chỉ dùng cho tiền phải trả và lỗi. Gọn, rõ, giống tờ hóa đơn thật.",
    sw: [["#1b2430","mực"],["#ffffff","giấy"],["#f6f6f3","nền"],["#c3302a","dấu đỏ"],["#167a55","được nhận"]],
    good: "Hợp khi: muốn tool trông nghiêm túc, đọc số nhanh, in hay chụp màn hình gửi nhóm đều đẹp.",
    bad: "Ít màu nhất, vui nhộn kém." },
  { cls: "b", logo: "logo-b", name: "Tiền polymer", idea: "Màu lấy từ tờ 500k (xanh ngọc) và 200k (vàng nâu). Đồng xu chữ đ tách làm hai. Tròn trịa, hiện đại như app ví điện tử.",
    sw: [["#0b6f73","500k"],["#0b8a87","nhấn"],["#c9862f","200k"],["#e6f3f1","nền"],["#0d3a42","chữ"]],
    good: "Hợp khi: muốn cảm giác app tài chính quen thuộc, dễ tin, dùng lâu không mỏi mắt.",
    bad: "An toàn — dễ giống app tiền khác." },
  { cls: "c", logo: "logo-c", name: "Ghế nhựa", idea: "Hai chiếc ghế nhựa xanh và đỏ của quán nhậu vỉa hè. Viền đậm, bóng đổ phẳng, nút vàng như bia. Vui và rất Việt Nam.",
    sw: [["#1d5fd8","ghế xanh"],["#e2362f","ghế đỏ"],["#ffc93c","bia"],["#eef3ff","nền"],["#16203a","viền"]],
    good: "Hợp khi: dùng chủ yếu cho đi ăn, đi chơi với bạn bè; muốn tool có cá tính, nhớ được.",
    bad: "Hơi suồng sã nếu dùng chia tiền công việc." },
];
const mock = `
  <div class="app">
    <div class="bar"><span class="lg"></span><b>Chia Tiền Nhóm</b><small>Đi Đà Lạt</small></div>
    <table class="mock">
      <thead><tr><th></th><th><strong>Ăn tối</strong>2.000.000</th><th><strong>Taxi</strong>120.000</th><th class="n">Còn lại</th></tr></thead>
      <tbody>
        <tr><th scope="row">Sếp</th><td><span class="box">✓</span><span class="tag t-paid">trả 2tr</span><br><span class="tag t-extra">mời 500k</span></td><td><span class="box">✓</span></td><td class="n pos">+1.085.000</td></tr>
        <tr><th scope="row">An</th><td><span class="box">✓</span></td><td><span class="box">✓</span></td><td class="n neg">−415.000</td></tr>
        <tr><th scope="row">Bình</th><td><span class="box">✓</span></td><td><span class="box">✓</span><span class="tag t-paid">trả 120k</span></td><td class="n neg">−295.000</td></tr>
        <tr><th scope="row">Chi</th><td><span class="box">✓</span></td><td><span class="box off"></span></td><td class="n neg">−375.000</td></tr>
      </tbody>
    </table>
    <div class="settle">
      <span>An → Sếp: <b>415.000 ₫</b></span>
      <span>Bình → Sếp: <b>295.000 ₫</b></span>
      <span>Chi → Sếp: <b>375.000 ₫</b></span>
      <button class="btn" type="button">Sao chép kết quả</button>
    </div>
  </div>`;
const root = document.getElementById("options");
for (const o of options) {
  const logo = document.getElementById(o.logo).innerHTML;
  const s = document.createElement("section");
  s.className = `opt ${o.cls}`;
  s.innerHTML = `
    <div class="opt-head">${logo}<div><h2 class="opt-name">${o.cls.toUpperCase()}. ${o.name}</h2><p class="opt-idea">${o.idea}</p></div></div>
    <div class="swatches">${o.sw.map(([c, n]) => `<span class="sw"><i style="background:${c}"></i>${n}</span>`).join("")}</div>
    <div class="icons"><span>${logo.replace("<svg", '<svg width="32" height="32"')}32px</span><span>${logo.replace("<svg", '<svg width="16" height="16"')}16px (tab)</span></div>
    ${mock}
    <div class="verdict"><p>${o.good}</p><p>${o.bad}</p></div>`;
  s.querySelector(".lg").innerHTML = logo;
  root.append(s);
}
</script>
</body>
</html>
